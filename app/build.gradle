plugins {
    id 'com.android.application'
}

android {
    compileSdkVersion 35
    namespace "com.aketsuky.aymusic"
    buildFeatures {
        buildConfig = true
    }



    android.applicationVariants.configureEach { variant ->
        if (variant.getName() == "release") {
            buildConfigField "boolean", "IS_RELEASE", "true"
            variant.mergedFlavor.manifestPlaceholders = [appName: "AyMusic"]
        } else {
            buildConfigField "boolean", "IS_RELEASE", "false"
            variant.mergedFlavor.applicationId = "com.aketsuky.aymusic.debug"
            variant.mergedFlavor.manifestPlaceholders = [appName: "AyMusic Dev"]
        }
        variant.mergeAssetsProvider.configure  {
            doLast {
                delete(fileTree(dir: outputDir, includes: ['node_modules/', '.git/**']))
            }
        }
    }

    defaultConfig {
        applicationId "com.aketsuky.aymusic"
        minSdkVersion 24
        targetSdkVersion 35
        versionCode 14
        versionName "0.3.7"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.webkit:webkit:1.14.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.9.0'
    implementation 'com.squareup.okhttp3:okhttp-urlconnection:4.4.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.media3:media3-session:1.8.0'
    implementation 'androidx.work:work-runtime:2.10.3'
    implementation 'com.google.guava:guava:33.3.1-android'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}