plugins {
    id 'com.android.application'
}

android {
    compileSdkVersion 37
    namespace "com.aketsuky.aymusic"
    buildFeatures {
        buildConfig = true
    }



    android.applicationVariants.configureEach { variant ->
        if (variant.getName() == "release") {
            buildConfigField "boolean", "IS_RELEASE", "true"
            variant.mergedFlavor.manifestPlaceholders = [appName: "AyMusic"]
        } else {
            buildConfigField "boolean", "IS_RELEASE", "false"
            variant.mergedFlavor.applicationId = "com.aketsuky.aymusic.debug"
            variant.mergedFlavor.manifestPlaceholders = [appName: "AyMusic Dev"]
        }
        variant.mergeAssetsProvider.configure  {
            doLast {
                delete(fileTree(dir: outputDir, includes: ['node_modules/', '.git/**', 'package*.json', 'docs/', 'readme.md', 'eslint.config.js']))
            }
        }
    }

    defaultConfig {
        applicationId "com.aketsuky.aymusic"
        minSdkVersion 24
        targetSdkVersion 37
        versionCode 15
        versionName "0.3.8"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.webkit:webkit:1.14.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:5.4.0'
    implementation 'com.squareup.okhttp3:okhttp:5.4.0'
    implementation 'com.squareup.okhttp3:okhttp-urlconnection:5.4.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.media3:media3-session:1.10.1'
    implementation 'androidx.work:work-runtime:2.11.2'
    implementation 'com.google.guava:guava:33.6.0-android'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}